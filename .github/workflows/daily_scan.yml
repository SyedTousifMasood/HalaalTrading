name: Daily Market Scan and Suggestions

on:
  schedule:
    # Run every Monday to Friday at 4:30 PM UTC (10:00 PM IST)
    - cron: '30 16 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Required to push the updated files back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Daily Swing and Intraday Scan
      run: |
        python scan_and_suggest.py

    - name: Commit and Push Scan Results
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Stage the scan outputs and spreadsheet
        git add Trading_Journal.xlsx Daily_Recommendations.md data/daily_recommendations.json
        
        if git diff-index --quiet HEAD; then
          echo "No changes to commit."
        else
          git commit -m "chore(auto-scan): daily post-market swing & intraday scan recommendations [skip ci]"
          git push
        fi
