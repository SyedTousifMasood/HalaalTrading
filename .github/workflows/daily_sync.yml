name: Daily Zerodha Journal Sync

on:
  schedule:
    # Run every Monday to Friday at 11:30 AM UTC (5:00 PM IST)
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Required to push the updated Excel journal back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # cache pip dependencies for faster runs

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Order Sync with Zerodha
      env:
        ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
        ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
        ZERODHA_TOTP_SECRET: ${{ secrets.ZERODHA_TOTP_SECRET }}
      run: |
        python main.py sync-zerodha-orders

    - name: Run Master Reconciliation & Styling
      env:
        ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
        ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
        ZERODHA_TOTP_SECRET: ${{ secrets.ZERODHA_TOTP_SECRET }}
      run: |
        python scratch/apply_reconciliation_and_styling.py

    - name: Commit and Push Updated Trading Journal
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Check if the spreadsheet was updated
        git add Trading_Journal.xlsx
        if git diff-index --quiet HEAD; then
          echo "No changes to commit."
        else
          git commit -m "chore(auto-sync): daily post-market order sync and journal reconciliation [skip ci]"
          git push
        fi
